name: BTC15M public research compute

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '[btc15m-research-compute]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record runner probe
        run: |
          mkdir -p research_compute_output
          python - <<'PY'
          import json, os, platform, sys
          out = {
              'status': 'ok',
              'actor': os.environ.get('GITHUB_ACTOR'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'python': sys.version,
              'platform': platform.platform(),
          }
          with open('research_compute_output/probe.json', 'w') as f:
              json.dump(out, f, indent=2, sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc15m-public-compute-probe
          path: research_compute_output/probe.json
          if-no-files-found: error
